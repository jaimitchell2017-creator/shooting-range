function pUpd(dt){if(P.hp<=0)return;

camUpd(dt)}
function camUpd(dt){const ib=P.mode==='bus',sy=Math.sin(P.yaw),cy=Math.cos(P.yaw),pc=Math.cos(P.pitch),sp=Math.sin(P.pitch),d=ib?26:P.board?6.5:4.6,sh=ib?0:.9;
pm.g.visible=!ib&&P.hp>0;pm.g.position.set(P.x,P.y,P.z);pm.g.rotation.y=P.yaw+Math.PI;pb.visible=P.board;

/* bots */
const NM=['Shadow','Blaze','Viper','Nova','Rogue','Titan','Ghost','Pixel','Raven','Echo','Frost','Zephyr'];
const bodyG=new THREE.CylinderGeometry(.38,.4,1.1,10).translate(0,.8,0),headG=new THREE.SphereGeometry(.26,12,10).translate(0,1.62,0),bgunG=new THREE.BoxGeometry(.08,.1,.5).translate(.3,1.1,.35),skinM=new THREE.MeshStandardMaterial({color:0xf1c27d}),bgM=new THREE.MeshStandardMaterial({color:0x222222});
function spot(r){for(let i=0;i<80;i++){const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r,x=Math.cos(a)*d,z=Math.sin(a)*d;if(H(x,z)>1.5)return[x,z]}return[0,0]}
function mkBot(i){const[x,z]=spot(380),g=new THREE.Group(),b=new THREE.Mesh(bodyG,new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(Math.random(),.6,.45)}));

return{g:ch.g,ch,bd,mode:'bus',jt:3+Math.random()*24,lx:0,lz:0,x,z,y:BUS_Y,hp:100,w,cd:1,rt:.7,tt:0,nu:15+Math.random()*25,wx:0,wz:0,sd:Math.random()<.5?-1:1,st:0,kills:0,name:NM[i%NM.length],dead:false,tg:null}}
function botUpd(b,dt){if(b.dead)return;
if(b.mode==='bus'){b.x=bp[0];b.z=bp[1];b.y=BUS_Y;if(BT>=b.jt||BT>=BUS_T){b.mode='fall';const a=Math.random()*6.28,r=Math.random()*110;b.lx=b.x+Math.cos(a)*r;b.lz=b.z+Math.sin(a)*r;const q=Math.hypot(b.lx,b.lz);if(q>400){b.lx*=400/q;b.lz*=400/q}b.bd.visible=true}b.g.position.set(b.x,b.y,b.z);return}
if(b.mode==='fall'){const dx=b.lx-b.x,dz=b.lz-b.z,d=Math.hypot(dx,dz)||1,v=Math.min(24,d*3+4),gy=H(b.x,b.z);b.x+=dx/d*v*dt;b.z+=dz/d*v*dt;b.y=Math.max(gy,b.y-22*dt);b.g.rotation.y=Math.atan2(dx,dz);b.g.position.set(b.x,b.y,b.z);if(b.y<=gy+.01){b.mode='ground';b.bd.visible=false}return}
b.nu-=dt;if(b.nu<0){b.nu=30+Math.random()*30;if(Math.random()<.75){b.w=Math.min(W.length-1,b.w+1);b.ch.gm.color.set(W[b.w].c)}}
b.tt-=dt;if(b.tt<0){b.tt=.4;let bd=85;b.tg=null;if(Math.random()<.1)b.sd*=-1;for(const o of[P,...bots]){if(o===b||(o.p?P.hp<=0||P.mode==='bus':o.dead||o.mode!=='ground'))continue;const d=Math.hypot(o.x-b.x,o.z-b.z);if(d<bd){bd=d;b.tg=o}}if(!b.tg)b.rt=.7}
const out=Math.hypot(b.x,b.z)>sr-15,g=b.tg,w=W[b.w];let tx=b.wx,tz=b.wz,sp=5;
if(out){tx=0;tz=0;sp=7}else if(Math.hypot(b.wx-b.x,b.wz-b.z)<5){const a=Math.random()*6.28,r=Math.random()*sr*.85;b.wx=Math.cos(a)*r;b.wz=Math.sin(a)*r}
if(g&&!out){const dx=g.x-b.x,dz=g.z-b.z,d=Math.hypot(dx,dz);b.g.rotation.y=Math.atan2(dx,dz);b.rt-=dt;b.cd-=dt;
if(d>w.rng*.5||d>35){tx=g.x;tz=g.z;sp=4}else{tx=b.x+dz*b.sd;tz=b.z-dx*b.sd;sp=3}
if(b.rt<=0&&b.cd<=0&&d<w.rng){b.cd=Math.max(w.r,.3)*1.3+Math.random()*.25;const miss=Math.random()>=Math.max(.08,.65-d/(w.rng*1.3));
tracer(new THREE.Vector3(b.x,b.y+1.3,b.z),new THREE.Vector3(g.x+(miss?(Math.random()-.5)*6:0),g.y+1.1,g.z+(miss?(Math.random()-.5)*6:0)),w.c);beep(160,.1,Math.min(.08,2.5/(d+8)),'sawtooth');

const mx=tx-b.x,mz=tz-b.z,ml=Math.hypot(mx,mz)||1;b.x+=mx/ml*sp*dt;b.z+=mz/ml*sp*dt;b.y=H(b.x,b.z);
if(!g||out)b.g.rotation.y=Math.atan2(mx,mz);b.g.position.set(b.x,b.y,b.z);anim(b.ch,MT,1);b.ch.tag.visible=Math.hypot(b.x-C.position.x,b.z-C.position.z)<110;
if(Math.hypot(b.x,b.z)>sr){b.st+=dt;if(b.st>=1){b.st=0;dmg(b,SD[stage],null)}}}
/* flow */
const locker=()=>W.map(w=>`<span style="display:inline-block;margin:3px;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.1);color:${xp>=w.xp?w.c:'#8a8f9c'}">${xp>=w.xp?'':'🔒 '}${w.n}${xp>=w.xp?'':' · '+w.xp+' XP'}</span>`).join('');
function menu(){state='menu';bots.forEach(b=>S.remove(b.g));bots=[];$('ui').style.display='flex';fill(0,0);
$('ub').innerHTML=`<h1>STORM DROP</h1><p>Battle royale on an endless, procedurally generated world. Loot glowing chests, outlast the shrinking storm and unlock new guns by playing.</p><p><b>Your XP: ${xp}</b></p><div>${locker()}</div><p style="opacity:.85">WASD move, Shift sprint, Space jump, mouse aim and fire, R reload, E open chest, 1-3 switch weapon. Jump from the battle bus with Space and your hoverboard equips automatically (Space up, C down, F hop off or back on). Arrow keys also aim.</p><button id="pb">Play</button>`;$('pb').onclick=lobby}
function lobby(){state='lobby';let t=30;const found=1;
const tick=()=>$('lp').textContent=`Players found: ${found}/5. Starting in ${t}s`;
$('ub').innerHTML=`<h1>Finding players…</h1><p id="lp"></p><p>If fewer than 5 players join within 30 seconds, bots fill the match.</p><button id="sk">Start now with bots</button>`;tick();
const go=()=>{clearInterval(iv);begin(found)},iv=setInterval(()=>{t--;tick();if(t<=0)go()},1000);$('sk').onclick=go}
function begin(found){resetWorld();const nb=found>=5?0:MATCH-found;$('ui').style.display='none';
const th=Math.random()*6.283,off=(Math.random()-.5)*300;bdir=[Math.cos(th),Math.sin(th)];bs=[-bdir[0]*480-bdir[1]*off,-bdir[1]*480+bdir[0]*off];bp=[bs[0],bs[1]];BT=0;const x=bs[0],z=bs[1];
Object.assign(P,{x,z,y:BUS_Y,mode:'bus',board:false,vy:0,hp:100,kills:0,yaw:Math.atan2(-bdir[0],-bdir[1]),pitch:.25,inv:[{w:0,a:12}],cur:0,rl:0,cd:0,st:0});
bots=Array.from({length:nb},(_,i)=>mkBot2(i));alive=found+nb;stage=0;sT=0;sFrom=sr=PH[0][0];MT=0;setGun();fill(x,z);state='play';
try{Promise.resolve(R.domElement.requestPointerLock()).catch(()=>{})}catch(e){}
msg('You are on the battle bus. Press SPACE to jump!','#ffd24a')}
function end(win){if(state!=='play')return;state='over';try{document.exitPointerLock()}catch(e){}md=0;
const place=win?1:placing,gain=P.kills*100+Math.max(0,11-place)*25+Math.floor(MT/60)*20+(win?300:0),old=xp;xp+=gain;save();
const nu=W.filter(w=>w.xp>old&&xp>=w.xp).map(w=>w.n);
setTimeout(()=>{$('ui').style.display='flex';$('ub').innerHTML=`<h1>${win?'VICTORY ROYALE':'ELIMINATED'}</h1><p>Placed #${place}. ${P.kills} eliminations. Survived ${Math.floor(MT)}s.</p><p><b>+${gain} XP</b> (total ${xp})</p>${nu.length?`<p style="color:#ffcf33"><b>New gun unlocked: ${nu.join(', ')}</b></p>`:''}<div>${locker()}</div><button id="pb">Play again</button>`;$('pb').onclick=menu},win?500:1400)}
/* input */
addEventListener('keydown',e=>{k[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(state!=='play')return;
if(e.code==='KeyR')reload();if(e.code==='KeyE'&&near&&P.mode!=='bus')open(near);if(e.code==='KeyF'&&P.mode==='ground'){P.board=!P.board;P.vy=0;if(P.board)P.y=Math.max(P.y,H(P.x,P.z)+2.5)}const n=+e.key;if(n>=1&&n<=P.inv.length){P.cur=n-1;P.rl=0;setGun()}});
addEventListener('keyup',e=>k[e.code]=0);
R.domElement.addEventListener('mousedown',e=>{if(state!=='play')return;if(!document.pointerLockElement){try{Promise.resolve(R.domElement.requestPointerLock()).catch(()=>{})}catch(x){}}md=1;shoot()});
addEventListener('mouseup',()=>md=0);addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousemove',e=>{if(document.pointerLockElement&&state==='play'){P.yaw-=e.movementX*.0022;P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch-e.movementY*.0022))}});
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()});
/* loop */
let last=performance.now(),a0=0,hudT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;const pl=state==='play';let fx=0,fz=0;
if(pl){MT+=dt;BT+=dt;bp=[bs[0]+bdir[0]*BUS_V*BT,bs[1]+bdir[1]*BUS_V*BT];bus.position.set(bp[0],BUS_Y,bp[1]);bus.rotation.y=Math.atan2(bdir[0],bdir[1]);stormUpd(dt);pUpd(dt);bots.forEach(b=>botUpd(b,dt));fx=P.x;fz=P.z;
if(P.mode!=='bus'&&Math.hypot(P.x,P.z)>sr){P.st+=dt;if(P.st>=1){P.st=0;dmg(P,SD[stage],null)}}}
else{a0+=dt*.08;C.position.set(Math.cos(a0)*80,40,Math.sin(a0)*80);C.lookAt(0,14,0)}
if(!pl)pm.g.visible=false;bus.visible=pl&&BT<BUS_T;$('hud').style.display=pl?'block':'none';updChunks(fx,fz);
const cp=C.position;sky.position.copy(cp);cl.position.copy(cp);cl.material.uniforms.t.value=now/1000;water.position.x=Math.round(cp.x/100)*100;water.position.z=Math.round(cp.z/100)*100;

hudT-=dt;if(pl&&hudT<=0){hudT=.1;const s=P.inv[P.cur],w=W[s.w],p=PH[stage],last=stage===PH.length-1,out=Math.hypot(P.x,P.z)>sr;
$('tp').innerHTML=`${alive} alive &nbsp; ${P.kills} elims<br>${sT<p[1]?'Storm closing '+Math.ceil(p[1]-sT)+'s':last?'Final circle':'Next shrink in '+Math.ceil(p[1]+p[2]-sT)+'s'}, zone ${Math.round(sr)}m${out?'<br><span style="color:#c58bff">You are in the storm</span>':''}`;
$('br').innerHTML=`<div style="width:220px;height:14px;background:#0008;border-radius:7px;overflow:hidden"><div style="height:100%;width:${Math.max(0,P.hp)}%;background:${P.hp>35?'#6ee86e':'#f55'}"></div></div>HP ${Math.ceil(Math.max(0,P.hp))}`;
$('wp').innerHTML=P.inv.map((q,i)=>`<span style="opacity:${i===P.cur?1:.45};color:${W[q.w].c}">[${i+1}] ${W[q.w].n}</span>`).join(' &nbsp; ')+`<br><span style="font-size:26px">${P.rl>0?'Reloading…':s.a+' / '+w.m}</span>`;
const c=$('mm').getContext('2d');c.clearRect(0,0,120,120);c.fillStyle='rgba(10,20,40,.6)';c.fillRect(0,0,120,120);c.strokeStyle='#b57bff';c.lineWidth=2;c.beginPath();c.arc(60,60,sr*.12,0,7);c.stroke();
